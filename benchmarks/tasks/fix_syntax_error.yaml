name: fix_syntax_error
description: |
  在当前目录创建文件 broken.py，内容如下（含一个语法错误，缺少冒号）：
  def add(a, b)
      return a + b
  print(add(2, 3))
  请修复 broken.py 中的语法错误，使脚本能正常运行并打印 5。
  修复后运行脚本应成功（退出码 0），不要删除 print 语句。
difficulty: medium
domain: debugging
verify:
  - type: file_exists
    path: "{{workdir}}/broken.py"
  - type: file_contains
    path: "{{workdir}}/broken.py"
    pattern: "def add"
  - type: command_succeeds
    command: "python {{workdir}}/broken.py"
